services:
  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=
      - POSTGRES_PASSWORD=
      - POSTGRES_DB=
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d debter"]
      interval: 3s
      timeout: 15s
      retries: 5
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_URL=
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/debter/start.sh"]
    command: ["./main"]