version: "1"
packages:
  - name: "db"  
    path: "./internal/port/outbound/db"
    queries: "./internal/port/outbound/query"
    schema: "./internal/port/outbound/migration"
    engine: "postgresql"
    emit_prepared_queries: true
    emit_interface: true
    emit_exact_table_names: false
    emit_json_tags: true
    json_tags_case_style: "camel"